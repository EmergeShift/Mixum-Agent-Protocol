[package]
name = "map-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "WASM bindings for M-ART .mart manifests"
repository = "https://github.com/EmergeShift/Mixum-Agent-Protocol"

[lib]
name = "map_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
map-snapshot = { path = "../../crates/map-snapshot" }
wasm-bindgen = "0.2"

# Standalone build: cargo build --target wasm32-unknown-unknown --manifest-path bindings/map-wasm/Cargo.toml
[workspace]
