[package]
name = "map-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Mixum Agent Protocol (MAP) core types and token handling — Rust SDK skeleton"
repository = "https://github.com/ashreo/Mixum-Agent-Protocol"

[features]
default = []
# ed25519 verification of map1. tokens (pulls ed25519-dalek)
token-verify = ["ed25519-dalek"]
# tokio-tungstenite client skeleton
client = ["tokio", "tokio-tungstenite", "futures-util"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ed25519-dalek = { version = "2", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "net", "time"] }
tokio-tungstenite = { version = "0.24", optional = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", optional = true }
